<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Snap - Side Panel</title>
    <script defer src="./dist/bundle.js"></script>
    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #f7f9fc;
        color: #1a1a1a;
      }

      .container {
        padding: 16px;
      }

      .card {
        background: #ffffff;
        border: 1px solid #dce3ec;
        border-radius: 10px;
        padding: 12px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      p {
        margin: 0 0 12px;
        font-size: 14px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: #0b57d0;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #0847aa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Study Snap</h1>
        <p>Only you can see this side panel.</p>
        <button id="start-activity">Open Main Stage</button>
      </div>
    </div>

    <script>
      window.addEventListener('load', () => {
        window.studySnapAddon
          .setUpSidePanel()
          .catch((error) => console.error('Side panel setup failed:', error));
      });
    </script>
  </body>
</html>
