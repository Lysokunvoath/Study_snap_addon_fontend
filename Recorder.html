<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Snap - Recorder</title>
    <script defer src="./dist/bundle.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg-a: #eef6ff;
        --bg-b: #f8fbff;
        --bg-c: #edf2ff;
        --surface: rgba(255, 255, 255, 0.84);
        --border: rgba(148, 163, 184, 0.22);
        --border-strong: rgba(96, 165, 250, 0.3);
        --text: #0f172a;
        --muted: #475569;
        --accent: #0f62fe;
        --accent-hover: #0047d6;
        --accent-soft: rgba(15, 98, 254, 0.12);
        --shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 16px;
        overflow: hidden;
        font-family: 'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif;
        color: var(--text);
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(14, 165, 233, 0.16), transparent 34%),
          radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.1), transparent 30%),
          linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 52%, var(--bg-c) 100%);
      }

      body::before {
        content: '';
        position: fixed;
        inset: 24px 24px auto auto;
        width: 180px;
        height: 180px;
        border-radius: 999px;
        background: rgba(15, 98, 254, 0.08);
        filter: blur(10px);
        pointer-events: none;
      }

      .panel {
        width: min(720px, 100%);
        max-height: 100%;
        overflow: auto;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        backdrop-filter: blur(22px);
        box-shadow: var(--shadow);
      }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 16px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .badge {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.08);
        color: #0f766e;
        font-size: 12px;
        font-weight: 700;
      }

      .badge::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #0f766e;
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
      }

      .field {
        display: grid;
        gap: 8px;
        margin: 0 0 14px;
      }

      label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 13px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.9);
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
      }

      input:focus {
        border-color: rgba(15, 98, 254, 0.48);
        box-shadow: 0 0 0 4px rgba(15, 98, 254, 0.12);
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin: 0 0 14px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(15, 98, 254, 0.1);
        color: var(--accent);
        font-weight: 700;
      }

      .status::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(15, 98, 254, 0.12);
      }

      .status-note {
        color: var(--muted);
        font-size: 12px;
      }

      .button-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin: 0 0 14px;
      }

      button {
        border: 1px solid transparent;
        border-radius: 14px;
        padding: 12px 14px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease, border-color 150ms ease;
        box-shadow: 0 12px 24px rgba(15, 98, 254, 0.18);
      }

      button:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: 0 16px 28px rgba(15, 98, 254, 0.22);
      }

      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(15, 98, 254, 0.16), 0 12px 24px rgba(15, 98, 254, 0.18);
      }

      button.ghost {
        background: rgba(15, 23, 42, 0.04);
        color: #334155;
        border-color: rgba(148, 163, 184, 0.18);
        box-shadow: none;
      }

      button.ghost:hover {
        background: rgba(15, 23, 42, 0.06);
        color: #0f172a;
        box-shadow: none;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .transcript {
        margin-top: 2px;
        border: 1px solid var(--border-strong);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.92));
        max-height: 320px;
        overflow: auto;
        padding: 14px;
        font-size: 14px;
        line-height: 1.5;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
      }

      .transcript .empty {
        color: #64748b;
      }

      .line {
        margin: 0 0 10px;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
      }

      .line.partial {
        color: #475569;
        font-style: italic;
        border-color: rgba(15, 98, 254, 0.12);
        background: rgba(15, 98, 254, 0.06);
      }

      .line.final {
        color: #0f172a;
        border-color: rgba(15, 118, 110, 0.12);
        background: rgba(15, 118, 110, 0.06);
      }

      .transcript::-webkit-scrollbar {
        width: 10px;
      }

      .transcript::-webkit-scrollbar-thumb {
        background: rgba(71, 85, 105, 0.24);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="hero">
        <div>
          <div class="eyebrow">Recorder window</div>
          <h1>Study Snap Recorder</h1>
          <p>Use this window to capture microphone outside the Meet iframe.</p>
        </div>
        <div class="badge">Host audio</div>
      </div>

      <div class="field">
        <label for="backend-url">Backend URL</label>
        <input
          id="backend-url"
          type="text"
          value="https://studysnapaddonbackend-production-45ff.up.railway.app"
          placeholder="https://your-backend.example.com"
        />
      </div>

      <div class="status-row">
        <div id="transcription-status" class="status">Idle</div>
        <div class="status-note">Connects the audio stream to Study Snap</div>
      </div>

      <div class="button-row">
        <button id="start-transcription">Start Transcription</button>
        <button id="stop-transcription" class="ghost" disabled>Stop</button>
        <button id="clear-transcript" class="ghost">Clear</button>
      </div>

      <div id="transcript" class="transcript">
        <div class="empty">Transcript will appear here.</div>
      </div>
    </div>

    <script>
      window.addEventListener('load', () => {
        window.studySnapAddon
          .initializeRecorderPage()
          .catch((error) => console.error('Recorder setup failed:', error));
      });
    </script>
  </body>
</html>
