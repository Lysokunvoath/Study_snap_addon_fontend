<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Snap - Recorder</title>
    <script defer src="./dist/bundle.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(170deg, #eef5ff, #f8fbff 60%, #ffffff);
        color: #111827;
        display: grid;
        place-items: center;
      }

      .panel {
        width: min(720px, calc(100% - 24px));
        background: #ffffff;
        border: 1px solid #d8e2f0;
        border-radius: 14px;
        padding: 18px;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 12px;
        color: #334155;
      }

      .field {
        display: grid;
        gap: 6px;
        margin: 0 0 12px;
      }

      label {
        font-size: 12px;
        color: #4b5563;
      }

      input {
        border: 1px solid #cfd8e3;
        border-radius: 8px;
        padding: 9px 10px;
        font-size: 13px;
      }

      .status {
        font-size: 12px;
        border-radius: 999px;
        padding: 6px 10px;
        display: inline-block;
        background: #e9f2ff;
        color: #0c3d82;
        margin: 0 0 10px;
      }

      .button-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 0 0 10px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: #0b57d0;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #0847aa;
      }

      button.ghost {
        background: #eef3fb;
        color: #12366b;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .transcript {
        margin-top: 10px;
        border: 1px solid #dce3ec;
        border-radius: 8px;
        background: #f9fbff;
        max-height: 300px;
        overflow: auto;
        padding: 10px;
        font-size: 14px;
        line-height: 1.45;
      }

      .transcript .empty {
        color: #6b7280;
      }

      .line {
        margin: 0 0 8px;
      }

      .line.partial {
        color: #425466;
        font-style: italic;
      }

      .line.final {
        color: #102a4a;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Study Snap Recorder</h1>
      <p>Use this window to capture microphone outside the Meet iframe.</p>

      <div class="field">
        <label for="backend-url">Backend URL</label>
        <input
          id="backend-url"
          type="text"
          value="https://studysnapaddonbackend-production.up.railway.app"
          placeholder="https://your-backend.example.com"
        />
      </div>

      <div id="transcription-status" class="status">Idle</div>

      <div class="button-row">
        <button id="start-transcription">Start Transcription</button>
        <button id="stop-transcription" class="ghost" disabled>Stop</button>
        <button id="clear-transcript" class="ghost">Clear</button>
      </div>

      <div id="transcript" class="transcript">
        <div class="empty">Transcript will appear here.</div>
      </div>
    </div>

    <script>
      window.addEventListener('load', () => {
        window.studySnapAddon
          .initializeRecorderPage()
          .catch((error) => console.error('Recorder setup failed:', error));
      });
    </script>
  </body>
</html>
