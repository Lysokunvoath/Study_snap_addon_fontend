<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Snap - Main Stage</title>
    <script defer src="./dist/bundle.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Segoe UI', sans-serif;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #e3f2ff, #f5f7ff 60%, #ffffff);
        color: #1a1a1a;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #dce3ec;
        border-radius: 14px;
        padding: 24px;
        max-width: 560px;
        width: calc(100% - 32px);
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Study Snap Main Stage</h1>
      <p>Everyone in the meeting can see this view.</p>
    </div>

    <script>
      window.addEventListener('load', () => {
        window.studySnapAddon
          .initializeMainStage()
          .catch((error) => console.error('Main stage setup failed:', error));
      });
    </script>
  </body>
</html>
