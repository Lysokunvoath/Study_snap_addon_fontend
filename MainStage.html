<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Snap - Main Stage</title>
    <script defer src="./dist/bundle.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg-a: #eef5ff;
        --bg-b: #f8fbff;
        --bg-c: #eef2ff;
        --surface: rgba(255, 255, 255, 0.76);
        --surface-strong: #ffffff;
        --border: rgba(148, 163, 184, 0.24);
        --border-strong: rgba(96, 165, 250, 0.35);
        --text: #0f172a;
        --muted: #475569;
        --accent: #0f62fe;
        --accent-hover: #0047d6;
        --accent-soft: rgba(15, 98, 254, 0.12);
        --success: #0f766e;
        --shadow: 0 24px 80px rgba(15, 23, 42, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(14, 165, 233, 0.18), transparent 33%),
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.14), transparent 30%),
          radial-gradient(circle at bottom center, rgba(15, 118, 110, 0.1), transparent 28%),
          linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 50%, var(--bg-c) 100%);
      }

      body::before,
      body::after {
        content: '';
        position: fixed;
        inset: auto;
        border-radius: 999px;
        filter: blur(12px);
        pointer-events: none;
      }

      body::before {
        width: 260px;
        height: 260px;
        left: -70px;
        top: -70px;
        background: rgba(59, 130, 246, 0.14);
      }

      body::after {
        width: 320px;
        height: 320px;
        right: -110px;
        bottom: -110px;
        background: rgba(15, 118, 110, 0.1);
      }

      .stage-shell {
        position: relative;
        width: min(1120px, 100%);
      }

      .stage-shell::before {
        content: '';
        position: absolute;
        inset: -14px;
        border-radius: 32px;
        background: linear-gradient(135deg, rgba(15, 98, 254, 0.08), rgba(14, 165, 233, 0.06), rgba(15, 118, 110, 0.05));
        filter: blur(26px);
        z-index: 0;
      }

      .panel {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--surface);
        backdrop-filter: blur(22px);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 14px;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(30px, 4vw, 46px);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .lede {
        max-width: 700px;
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 20px 0 18px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(15, 98, 254, 0.1);
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .status::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(15, 98, 254, 0.12);
      }

      .status-note {
        color: var(--muted);
        font-size: 13px;
      }

      .transcript {
        border: 1px solid var(--border-strong);
        border-radius: 22px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(248, 250, 252, 0.92)),
          #ffffff;
        min-height: 320px;
        max-height: min(66vh, 760px);
        overflow: auto;
        padding: 16px;
        font-size: 16px;
        line-height: 1.6;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      .transcript .empty {
        color: #64748b;
      }

      .line {
        margin: 0 0 12px;
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      }

      .line.partial {
        color: #475569;
        font-style: italic;
        border-color: rgba(15, 98, 254, 0.12);
        background: rgba(15, 98, 254, 0.06);
      }

      .line.final {
        color: #0f172a;
        border-color: rgba(15, 118, 110, 0.12);
        background: rgba(15, 118, 110, 0.06);
      }

      .transcript::-webkit-scrollbar {
        width: 10px;
      }

      .transcript::-webkit-scrollbar-thumb {
        background: rgba(71, 85, 105, 0.24);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
    </style>
  </head>
  <body>
    <div class="stage-shell">
      <div class="panel">
        <div class="eyebrow">Shared meeting view</div>
        <h1>Study Snap Main Stage</h1>
        <p class="lede">Everyone in the meeting can see this live transcript feed as it updates.</p>
        <div class="meta-row">
          <div id="mainstage-status" class="status">Waiting for transcription...</div>
          <div class="status-note">Mirrors the host recorder in real time</div>
        </div>
        <div id="mainstage-transcript" class="transcript">
          <div class="empty">Transcript will appear here when the host starts transcription.</div>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener('load', () => {
        window.studySnapAddon
          .initializeMainStage()
          .catch((error) => console.error('Main stage setup failed:', error));
      });
    </script>
  </body>
</html>
