<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Snap - Main Stage</title>
    <script defer src="./dist/bundle.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Segoe UI', sans-serif;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #e3f2ff, #f5f7ff 60%, #ffffff);
        color: #1a1a1a;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #dce3ec;
        border-radius: 14px;
        padding: 24px;
        max-width: 840px;
        width: calc(100% - 32px);
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .status {
        font-size: 13px;
        border-radius: 999px;
        display: inline-block;
        padding: 6px 10px;
        background: #e9f2ff;
        color: #0c3d82;
        margin: 0 0 12px;
      }

      .transcript {
        border: 1px solid #dce3ec;
        border-radius: 10px;
        background: #f9fbff;
        min-height: 220px;
        max-height: 380px;
        overflow: auto;
        padding: 12px;
        font-size: 16px;
        line-height: 1.5;
      }

      .transcript .empty {
        color: #6b7280;
      }

      .line {
        margin: 0 0 10px;
      }

      .line.partial {
        color: #425466;
        font-style: italic;
      }

      .line.final {
        color: #102a4a;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Study Snap Main Stage</h1>
      <p>Everyone in the meeting can see this view.</p>
      <div id="mainstage-status" class="status">Waiting for transcription...</div>
      <div id="mainstage-transcript" class="transcript">
        <div class="empty">Transcript will appear here when the host starts transcription.</div>
      </div>
    </div>

    <script>
      window.addEventListener('load', () => {
        window.studySnapAddon
          .initializeMainStage()
          .catch((error) => console.error('Main stage setup failed:', error));
      });
    </script>
  </body>
</html>
